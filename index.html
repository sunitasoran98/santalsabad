<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SantalSabad: Santali Hindi English Dictionary</title>
<meta name="description" content="SantalSabad – Santali, Hindi aur English ka shabdkosh. By BOSC (Baski Online Service Center).">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+Ol+Chiki&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy2:#13305a;--ink:#1d1d1f;--muted:#5f6670;--line:#dfe3e8;--bg:#f7f6f2;--accent:#b4232c;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
a{color:var(--navy2)}
.serif{font-family:"Source Serif 4","Noto Serif Devanagari",Georgia,serif}
.olchiki{font-family:"Noto Sans Ol Chiki",sans-serif}
header{background:var(--navy);color:#fff}
.topbar{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#fff}
.brand b{font-family:"Source Serif 4",serif;font-size:26px;letter-spacing:.5px}
.brand span{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1.5px}
nav a{color:#cfd8e6;text-decoration:none;font-size:14px;margin-left:18px}
nav a:hover{color:#fff}
.hero{max-width:1100px;margin:auto;padding:28px 20px 34px}
.hero h1{font-family:"Source Serif 4",serif;font-weight:400;font-size:30px;margin:0 0 6px}
.hero p{margin:0 0 18px;color:#cfd8e6}
.search{position:relative;max-width:760px}
.search input{width:100%;padding:16px 56px 16px 18px;font-size:18px;border:0;border-radius:4px;font-family:inherit;outline:3px solid transparent}
.search input:focus{outline-color:#6f8fbf}
.search button{position:absolute;right:6px;top:6px;bottom:6px;width:46px;border:0;border-radius:3px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.suggest{position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-top:0;z-index:5;max-height:340px;overflow:auto;display:none}
.suggest div{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.suggest div:hover,.suggest div.on{background:#eef2f8}
.suggest small{color:var(--muted)}
main{max-width:1100px;margin:auto;padding:28px 20px 60px;display:grid;grid-template-columns:1fr 280px;gap:32px}
@media(max-width:820px){main{grid-template-columns:1fr}nav{display:none}.hero h1{font-size:24px}}
.card{background:var(--paper);border:1px solid var(--line);padding:28px 32px}
@media(max-width:600px){.card{padding:20px}}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.hw{font-family:"Source Serif 4",serif;font-size:44px;font-weight:700;margin:0;line-height:1.1}
.meta{margin:8px 0 4px;color:var(--muted);font-size:15px}
.meta .ipa{font-family:"Source Serif 4",serif;color:var(--ink)}
.meta .oc{font-size:22px;color:var(--ink);margin-left:6px}
.pos{display:inline-block;font-family:"Source Serif 4",serif;font-style:italic;color:var(--accent);font-size:18px;margin:14px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 8px}
.tabs span{padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--navy2);border-bottom:3px solid var(--navy2)}
ol.senses{padding-left:0;list-style:none;counter-reset:s;margin:10px 0}
ol.senses>li{counter-increment:s;padding:14px 0 14px 42px;position:relative;border-bottom:1px dotted var(--line)}
ol.senses>li:before{content:counter(s);position:absolute;left:0;top:13px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:600}
.def{font-family:"Source Serif 4","Noto Serif Devanagari",serif;font-size:19px}
.def .hi{font-family:"Noto Serif Devanagari",serif}
.def .sep{color:var(--muted);margin:0 8px}
.ex{margin-top:8px;padding-left:14px;border-left:3px solid #d6dbe3;font-family:"Source Serif 4","Noto Serif Devanagari",serif}
.ex i{display:block;font-size:17px}
.ex span{color:var(--muted);font-size:15px}
.rel{margin-top:18px;font-size:15px}
.rel a{margin-right:10px}
.cite{margin-top:24px;font-size:12px;color:var(--muted)}
aside .box{background:var(--paper);border:1px solid var(--line);padding:18px 20px;margin-bottom:20px}
aside h3{font-family:"Source Serif 4",serif;font-weight:600;margin:0 0 10px;font-size:18px;border-bottom:2px solid var(--navy);padding-bottom:6px}
aside a{display:block;text-decoration:none;padding:3px 0}
.az{display:flex;flex-wrap:wrap;gap:6px}
.az a{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border:1px solid var(--line);font-family:"Source Serif 4",serif}
.az a:hover{background:var(--navy);color:#fff}
.list a.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dotted var(--line);text-decoration:none;color:var(--ink)}
.list a.item b{font-family:"Source Serif 4",serif;font-size:20px;color:var(--navy2)}
.list a.item span{color:var(--muted)}
.wotd .hw{font-size:34px}
footer{background:var(--navy);color:#cfd8e6;font-size:13px}
footer div{max-width:1100px;margin:auto;padding:20px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <a class="brand" href="#/"><b>SantalSabad</b><span>Santali · Hindi · English</span></a>
    <nav><a href="#/">Home</a><a href="#/browse/a">Browse A–Z</a><a href="#/about">About</a></nav>
  </div>
  <div class="hero">
    <h1>Santali–Hindi–English Dictionary</h1>
    <p>Santali, Hindi, English ya Ol Chiki mein koi bhi shabd likhiye</p>
    <div class="search">
      <input id="q" type="search" placeholder="e.g. dak', पानी, water" autocomplete="off" aria-label="Search">
      <button id="go" aria-label="Search">&#9906;</button>
      <div class="suggest" id="sug"></div>
    </div>
  </div>
</header>

<main>
  <section id="view"></section>
  <aside>
    <div class="box"><h3>Browse A–Z</h3><div class="az" id="az"></div></div>
    <div class="box"><h3>Recent words</h3><div id="recent" class="empty">Abhi koi nahi</div></div>
  </aside>
</main>

<footer><div>© <span id="yr"></span> SantalSabad · By BOSC (Baski Online Service Center)</div></footer>

<script>
const H=['Shabd','Uchcharan','Shabd-bhed','Arth no.','Hindi','English','Udaharan (Santali)','Udaharan ka anuvad','Ol Chiki','Sambandhit shabd'];
let entries={}, order=[];
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’`]/g,"'").trim();

function parseCSV(t){const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}

async function load(){
  const txt=await (await fetch('words.csv')).text();
  const rows=parseCSV(txt.replace(/^\uFEFF/,''));const head=rows.shift().map(h=>h.trim());
  const ix=n=>head.indexOf(n);
  rows.forEach(r=>{const g=n=>(r[ix(n)]||'').trim();const w=g('Shabd');if(!w)return;
    const k=norm(w);
    if(!entries[k]){entries[k]={w,ipa:g('Uchcharan'),oc:g('Ol Chiki'),rel:g('Sambandhit shabd'),pos:{}};order.push(k)}
    const e=entries[k];if(!e.ipa)e.ipa=g('Uchcharan');if(!e.oc)e.oc=g('Ol Chiki');if(!e.rel)e.rel=g('Sambandhit shabd');
    const p=g('Shabd-bhed')||'—';(e.pos[p]=e.pos[p]||[]).push({n:+g('Arth no.')||99,hi:g('Hindi'),en:g('English'),ex:g('Udaharan (Santali)'),tr:g('Udaharan ka anuvad')})});
  order.sort((a,b)=>a.localeCompare(b));
  const letters=[...new Set(order.map(k=>k[0]))];
  $('#az').innerHTML=letters.map(l=>`<a href="#/browse/${encodeURIComponent(l)}">${esc(l.toUpperCase())}</a>`).join('');
  route();
}

function search(q){q=norm(q);if(!q)return[];const out=[];
  for(const k of order){const e=entries[k];let score=0;
    if(k===q||norm(e.oc)===q)score=100;else if(k.startsWith(q))score=80;
    else{for(const p in e.pos)for(const s of e.pos[p]){
      const hay=[s.hi,s.en].join(';').split(/[;,]/).map(norm);
      if(hay.includes(q)||hay.includes('to '+q))score=Math.max(score,70);
      else if(hay.some(h=>h.startsWith(q)))score=Math.max(score,50);
      else if(hay.some(h=>h.includes(q)))score=Math.max(score,30)}}
    if(score)out.push([score,k])}
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1])}

function gloss(e){const s=Object.values(e.pos)[0][0];return [s.hi,s.en].filter(Boolean).join(' · ')}

function entryHTML(k){const e=entries[k];if(!e)return`<div class="card"><p class="empty">Ye shabd abhi dictionary mein nahi hai.</p></div>`;
  let h=`<div class="card"><div class="crumb"><a href="#/">Home</a> › ${esc(e.w)}</div>
  <h1 class="hw">${esc(e.w)}</h1>
  <div class="meta">${e.ipa?`<span class="ipa">/${esc(e.ipa)}/</span>`:''}${e.oc?`<span class="oc olchiki">${esc(e.oc)}</span>`:''}</div>
  <div class="tabs"><span>Meaning &amp; use</span></div>`;
  for(const p in e.pos){h+=`<div class="pos">${esc(p)}</div><ol class="senses">`;
    e.pos[p].sort((a,b)=>a.n-b.n).forEach(s=>{h+=`<li><div class="def"><span class="hi">${esc(s.hi)}</span>${s.hi&&s.en?'<span class="sep">|</span>':''}${esc(s.en)}</div>`;
      if(s.ex)h+=`<div class="ex"><i>${esc(s.ex)}</i>${s.tr?`<span>${esc(s.tr)}</span>`:''}</div>`;h+='</li>'});h+='</ol>'}
  if(e.rel)h+=`<div class="rel"><b>Sambandhit shabd:</b> ${e.rel.split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>`<a href="#/word/${encodeURIComponent(norm(x))}">${esc(x)}</a>`).join('')}</div>`;
  h+=`<div class="cite">SantalSabad: Santali Hindi English Dictionary, “${esc(e.w)}”, by BOSC.</div></div>`;return h}

function listHTML(title,keys){return `<div class="card"><div class="crumb"><a href="#/">Home</a> › ${esc(title)}</div><h2 class="serif" style="margin-top:0">${esc(title)}</h2>
  <div class="list">${keys.length?keys.map(k=>`<a class="item" href="#/word/${encodeURIComponent(k)}"><b>${esc(entries[k].w)}</b><span>${esc(gloss(entries[k]))}</span></a>`).join(''):'<p class="empty">Koi shabd nahi mila.</p>'}</div></div>`}

function home(){const d=new Date();const k=order[(d.getFullYear()*372+d.getMonth()*31+d.getDate())%order.length];
  return `<div class="card wotd"><div class="crumb">Aaj ka shabd · Word of the day</div>${entryHTML(k).replace(/^<div class="card">/,'').replace(/<div class="crumb">.*?<\/div>/,'').replace(/<\/div>$/,'')}
  <p class="empty" style="margin-top:20px">Dictionary mein abhi ${order.length} shabd hain.</p></div>`}

function about(){return `<div class="card"><h2 class="serif" style="margin-top:0">About SantalSabad</h2><p>SantalSabad Santali bhasha ke shabdon ko Hindi aur English arth, uchcharan, udaharan aur Ol Chiki lipi ke saath ek jagah laata hai.</p><p>Prastut karta: <b>BOSC – Baski Online Service Center</b></p></div>`}

function remember(k){let r=JSON.parse(localStorage.getItem('ss_recent')||'[]');r=[k,...r.filter(x=>x!==k)].slice(0,8);localStorage.setItem('ss_recent',JSON.stringify(r));showRecent()}
function showRecent(){const r=JSON.parse(localStorage.getItem('ss_recent')||'[]').filter(k=>entries[k]);if(r.length)$('#recent').innerHTML=r.map(k=>`<a href="#/word/${encodeURIComponent(k)}">${esc(entries[k].w)}</a>`).join('')}

function route(){const [,v,a]=(location.hash||'#/').split('/');const arg=decodeURIComponent(a||'');let h;
  if(v==='word'){h=entryHTML(arg);if(entries[arg])remember(arg);document.title=(entries[arg]?entries[arg].w+' – ':'')+'SantalSabad'}
  else if(v==='search'){const r=search(arg);h=r.length===1?entryHTML(r[0]):listHTML(`“${arg}” ke results`,r)}
  else if(v==='browse')h=listHTML(arg.toUpperCase(),order.filter(k=>k.startsWith(arg)));
  else if(v==='about')h=about();else h=home();
  $('#view').innerHTML=h;showRecent();window.scrollTo(0,0)}

const q=$('#q'),sug=$('#sug');let sel=-1;
q.addEventListener('input',()=>{const r=search(q.value).slice(0,8);sel=-1;
  sug.innerHTML=r.map(k=>`<div data-k="${esc(k)}"><b class="serif">${esc(entries[k].w)}</b><small>${esc(gloss(entries[k]))}</small></div>`).join('');sug.style.display=r.length?'block':'none'});
sug.addEventListener('click',e=>{const d=e.target.closest('div[data-k]');if(d){location.hash='#/word/'+encodeURIComponent(d.dataset.k);sug.style.display='none';q.value=''}});
q.addEventListener('keydown',e=>{const items=[...sug.children];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('on',i===sel));e.preventDefault()}
  if(e.key==='Enter'){if(sel>=0&&items[sel])items[sel].click();else go()}});
function go(){if(q.value.trim()){location.hash='#/search/'+encodeURIComponent(q.value.trim());sug.style.display='none'}}
$('#go').onclick=go;document.addEventListener('click',e=>{if(!e.target.closest('.search'))sug.style.display='none'});
window.addEventListener('hashchange',route);$('#yr').textContent=new Date().getFullYear();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
